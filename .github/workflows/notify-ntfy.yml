# 每個台股交易日 09:30（台北）用 ntfy 推播五個策略的當日持倉。
# 觸發方式：由 cron-job.org 在週一到週五 09:30（Asia/Taipei）呼叫 workflow_dispatch（比 GitHub 內建排程準時）；台股休市日腳本會自行略過。
# 需要在 repo 的 Settings → Secrets and variables → Actions 新增 secret：NTFY_TOPIC（你自己取的、別人猜不到的主題名稱）。
name: notify-ntfy
on:
  workflow_dispatch:
    inputs:
      force:
        description: '測試：忽略休市與等待，立刻用目前資料推播 (true/false)'
        default: 'false'
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install openpyxl
      - name: send
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
        run: |
          if [ "$FORCE" = "true" ]; then python3 scripts/notify_ntfy.py --force; else python3 scripts/notify_ntfy.py; fi
